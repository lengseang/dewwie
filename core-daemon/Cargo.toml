[package]
name = "swarmherd-core-daemon"
version = "0.1.2"
edition = "2021"
authors = ["SwarmHerd Team"]
description = "High-performance persistent daemon managing PTY sessions, Git worktrees, dynamic port routing, and OSC 7501 event streams"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
portable-pty = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.30"
tokio-util = { version = "0.7", features = ["codec"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"

[dev-dependencies]
tempfile = "3.10"
